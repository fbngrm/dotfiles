# ============================================================
# GRUVBOX COLORS & VARIABLES
# ============================================================
set $mod Mod4
set $term kitty

set $bg-color            #282828
set $text-color          #ebdbb2
set $focused-bg-color    #c0de49
set $inactive-bg-color   #3c3836
set $urgent-bg-color     #cc241d
set $indicator-color     #83a598
set $gruv-pink           #d3869b
set $black               #000000

# ============================================================
# THIN PINK HEADER LOGIC
# ============================================================
# This tiny font size (2) defines the thickness of your pink line.
font pango:JetBrainsMono Nerd Font 1

# Remove all padding to keep it strictly a 2-3px line
# titlebar_padding 0 0

# 'normal' enables the titlebar (our pink line), 0 removes sides/bottom
default_border normal 0
default_floating_border normal 0

# Hide text so the titlebar becomes a solid colored bar
for_window [class=".*"] title_format " "

# Hide the line entirely if only one window is open
# smart_borders on
# hide_edge_borders both
smart_gaps on
gaps inner 5

# --- Window Colors ---
# class                 border      backgr.     text        indicator   child_border
client.focused          $gruv-pink  $gruv-pink  $gruv-pink  $gruv-pink  $gruv-pink
client.unfocused        $black      $black      $black      $black      $black
client.focused_inactive $black      $black      $black      $black      $black
client.urgent           #cc241d     #cc241d     #ebdbb2     #cc241d     #cc241d

# ============================================================
# OUTPUTS
# ============================================================
output eDP-1 scale 1.3 res 2256x1504 pos 0 0

# ============================================================
# AUTOSTART
# ============================================================

exec_always swaybg -i ~/Pictures/sun.png -m center -c "#000000"
exec_always "pkill waybar || true; exec waybar"
exec gammastep-indicator
exec wl-paste --watch cliphist store
exec fcitx5
# battery-critical suspend is handled by the sway-battery-check systemd
# timer (sway/battery-check.timer), not by swayidle, so it keeps checking
# even while the machine is actively in use.
exec swayidle -w \
    timeout 300 '~/.config/sway/scripts/lock.sh' \
    timeout 600 'swaymsg "output * dpms off"' \
    resume 'swaymsg "output * dpms on"' \
    before-sleep '~/.config/sway/scripts/lock.sh'
exec mako
exec_always dropbox start
exec_always pkill conky; conky -c ~/.config/conky/info_screen.conf
exec nm-applet

# ============================================================
# AUDIO & BRIGHTNESS (Function Keys)
# ============================================================

# Audio Control (Pipewire/PulseAudio)
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +10%
bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -10%
bindsym XF86AudioMute        exec pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioMicMute     exec pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness Control (Requires brightnessctl)
bindsym XF86MonBrightnessUp         exec brightnessctl set +1%
bindsym Shift+XF86MonBrightnessUp   exec brightnessctl set +5%
bindsym $mod+XF86MonBrightnessUp    exec brightnessctl set +100%
bindsym XF86MonBrightnessDown       exec brightnessctl set 1%-
bindsym Shift+XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym $mod+XF86MonBrightnessDown  exec brightnessctl set 1%

# ============================================================
# KEYBINDINGS
# ============================================================
bindsym $mod+Return exec $term
bindsym $mod+Shift+q kill
bindsym $mod+d exec rofi -show run -theme gruvbox-dark
bindsym $mod+c exec cliphist list | rofi -dmenu -theme gruvbox-dark | cliphist decode | wl-copy

# Navigation (HJKL)
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# Move Containers
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# Move to monitor
bindsym $mod+Shift+m move workspace to output right
bindsym $mod+Shift+n move workspace to output left

# ============================================================
# SCREENSHOTS (grim + slurp + swappy)
# ============================================================

# 1. Area selection -> Save to Pictures + Copy to Clipboard
bindsym $mod+Shift+s exec grim -g "$(slurp)" ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot" "Selection saved to Pictures"

# 2. Area selection -> Open in 'swappy' (to edit/draw before saving)
# Requires 'pacman -S swappy'
bindsym $mod+Shift+e exec grim -g "$(slurp)" - | swappy -f -

# 3. Full Screen -> Save to Pictures
bindsym Print exec grim ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot" "Full screen saved"

# 4. Focused Window -> Save to Pictures (Simplified version)
bindsym $mod+Print exec grim -g "$(swaymsg -t get_tree | jq -r '.. | select(.focused? == true) | .rect | "\(.x),\(.y) \(.width)x\(.height)"')" ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png

# ============================================================
# MODES
# ============================================================

# 1. Open Menu
set $mode_open Open (k) kitty, (m) mail, (v) vivaldi, (f) firefox, (a) anki, (c) code, (t) telegram, (h) thunar
mode "$mode_open" {
    # We set a larger font here so the menu text is actually readable
    bindsym k exec env GLFW_IM_MODULE=ibus kitty, mode "default"
    bindsym m exec thunderbird, mode "default"
    bindsym v exec vivaldi-stable, mode "default"
    bindsym t exec telegram-desktop, mode "default"
    bindsym f exec firefox, mode "default"
    bindsym a exec anki, mode "default"
    bindsym c exec code, mode "default"
    bindsym h exec thunar, mode "default"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+o mode "$mode_open"

# 2. System Menu
set $mode_system System (l) lock, (e) logout, (s) suspend, (h) hibernate, (r) reboot, (CTRL+s) shutdown
mode "$mode_system" {
    bindsym l exec ~/.config/sway/scripts/lock.sh, mode "default"
    bindsym e exit
    bindsym s exec systemctl suspend, mode "default"
    bindsym h exec systemctl hibernate, mode "default"
    bindsym r exec systemctl reboot, mode "default"
    bindsym Ctrl+s exec systemctl poweroff, mode "default"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+BackSpace mode "$mode_system"

# lock screen (screenshot + blur), same as i3lockwall in i3/config
bindsym $mod+Ctrl+Shift+l exec ~/.config/sway/scripts/lock.sh

# ============================================================
# WORKSPACES & NAVIGATION
# ============================================================
set $ws1 "1:web"
set $ws2 "2:code"
set $ws3 "3:code"
set $ws4 "4:code"
set $ws5 "5:mail"
set $ws6 "6:zsh"
set $ws7 "7:info"
set $ws9 "9:notes"

bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+9 workspace $ws9

bindsym $mod+Shift+1 move container to workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3
bindsym $mod+Shift+4 move container to workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5
bindsym $mod+Shift+6 move container to workspace $ws6
bindsym $mod+Shift+7 move container to workspace $ws7
bindsym $mod+Shift+9 move container to workspace $ws9

# ============================================================
# WINDOW RULES (Assignments & Behaviors)
# ============================================================
# This strictly pins Conky to Workspace 8 and prevents it from floating over other workspaces
for_window [class="conky"] {
    move to workspace $ws7
    floating enable
    sticky disable
    border none
    focus_passing yes
    no_focus
}

workspace_auto_back_and_forth yes

# ============================================================
# STARTUP SEQUENCE
# ============================================================
exec_always {
    swaymsg "workspace $ws9; exec kitty --title notes -e nvim /home/f/Dropbox/notes"
    swaymsg "workspace $ws7"
    swaymsg "workspace $ws6; exec kitty --title work-terminal --directory /home/f/work/src/github.com/fbngrm"
    swaymsg "workspace $ws5; exec thunderbird"
    swaymsg "workspace $ws4; layout tabbed; exec kitty --title work-terminal --directory /home/f/work/src/github.com/fbngrm/zh-patterns; exec code /home/f/work/src/github.com/fbngrm/zh-patterns"
    swaymsg "workspace $ws3; layout tabbed; exec kitty --title work-terminal --directory /home/f/work/src/github.com/fbngrm/tingting; exec code /home/f/work/src/github.com/fbngrm/tingting"
    swaymsg "workspace $ws2; layout tabbed; exec kitty --title work-terminal --directory /home/f/work/src/github.com/fbngrm/DER-DIE-DAS; exec code /home/f/work/src/github.com/fbngrm/DER-DIE-DAS"
    swaymsg "workspace $ws1; exec firefox"
}

# ============================================================
# WINDOW RULES (Floating)
# ============================================================
for_window [window_role="pop-up"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [app_id="blueman-manager"] floating enable
for_window [app_id="pavucontrol"] floating enable
for_window [app_id="nm-connection-editor"] floating enable

# ============================================================
# OUTPUTS & WALLPAPER
# ============================================================
output eDP-1 scale 1.3 res 2256x1504 pos 0 0
output * bg /home/f/Pictures/Wallpapers/Sierpinski_triangle.svg center #000000

# ============================================================
# LAYOUT & WINDOW CONTROL
# ============================================================

# Switch the current container between different layout styles
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# Make the current focus floating
bindsym $mod+Shift+space floating toggle

# Swap focus between the tiling area and the floating area
bindsym $mod+space focus mode_toggle

# Move focus to the parent container
bindsym $mod+a focus parent

bindsym $mod+r mode "resize"

mode "resize" {
    # Resize using Vim-style keys (h, j, k, l)
    bindsym h resize shrink width 10px
    bindsym j resize grow height 10px
    bindsym k resize shrink height 10px
    bindsym l resize grow width 10px

    # Resize using arrow keys
    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px

    # Exit resize mode
    bindsym Escape mode "default"
    bindsym Return mode "default"
    bindsym $mod+r mode "default"
}

set $browser firefox
